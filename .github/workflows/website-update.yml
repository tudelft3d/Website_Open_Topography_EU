name: website update

on: 
  push:
    branches: 
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: trigger update
        run: |
          HTTP_CODE=$(curl --max-time 600 -s -L --no-buffer \
            -o /tmp/update_response.txt \
            -w "%{http_code}" \
            ${{ secrets.UPDATE_URL }})
          cat /tmp/update_response.txt
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Error: server returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          if grep -qi "killed\|timeout\|error\|traceback" /tmp/update_response.txt; then
            echo "Error: response indicates failure"
            exit 1
          fi
