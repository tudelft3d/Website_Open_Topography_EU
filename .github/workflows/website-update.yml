name: website update

on: 
  push:
    branches: 
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: trigger update
        run: |
          HTTP_CODE=$(curl --max-time 600 -s -L --no-buffer \
            -o /tmp/update_response.txt \
            -w "%{http_code}" \
            ${{ secrets.UPDATE_URL }})
          CURL_EXIT=$?
          cat /tmp/update_response.txt
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -ge 400 ] || [ "$HTTP_CODE" = "000" ]; then
            echo "Error: update request failed (curl exit=${CURL_EXIT}, HTTP=${HTTP_CODE})"
            exit 1
          fi
          if grep -qiE "traceback|fatal:|error:|killed" /tmp/update_response.txt; then
            echo "Error: response indicates failure"
            exit 1
          fi
